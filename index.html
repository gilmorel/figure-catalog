/* Layout: a collector's shelf: grouped by toy line, each listing a backer card with a peg hole */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#18202A; --ink:#E8EDF3; --muted:#9AA5B3; --line:#2A3542;
  --accent:#8199FF; --accent-ink:#0B1020; --tag:#F2B417; --tag-ink:#241A00;
  --shot:#212B37; --danger:#FF8A80; --ok:#6FD39A; --scrim:rgba(0,0,0,.88); --v-lo:#FF7B6E; --v-md:#F2C744; --v-hi:#5FD08E; color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#picker{position:fixed;top:0;left:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{padding-block:40px 20px;display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,60px);line-height:.95;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lede{margin:12px 0 0;color:var(--muted);max-width:52ch}
.stats{display:flex;gap:28px;margin:0}
.stats div{display:flex;flex-direction:column}
.stats dt{order:2;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats dd{order:1;margin:0;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}

.owner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.owner strong{color:var(--accent)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px 9px 36px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-weight:500;opacity:.7;margin-left:4px}

main{padding-block:8px 120px}
.group{padding-top:28px}
.group h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 14px;font-size:20px;font-weight:700;text-wrap:balance}
.group h2 .brand{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:16px}
@media (max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}

.card{background:var(--surface);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:0 1px 0 var(--line)}
.card.drag{outline:2px dashed var(--accent);outline-offset:-2px}
.shot{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--shot)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button.zoom{all:unset;position:absolute;inset:0;cursor:zoom-in}
.shot button.zoom:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.peg{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:36px;height:10px;border-radius:6px;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);z-index:1;pointer-events:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;
  background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--line) 55%,transparent) 10px 11px)}
.empty span{padding:0 12px}
.qty{position:absolute;right:8px;bottom:8px;font-family:var(--f-mono);font-size:13px;background:var(--tag);color:var(--tag-ink);border-radius:6px;padding:2px 7px;z-index:1}
.state{position:absolute;left:8px;top:28px;right:8px;z-index:3;font-size:12px;font-weight:600;border-radius:6px;padding:4px 8px;z-index:2;background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.state.err{color:var(--danger)} .state.ok{color:var(--ok)}
.tools{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;z-index:2}
.btn{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:8px;padding:7px 11px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{font-size:12px;padding:6px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sub{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
.body h3{margin:0;font-size:15px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.cond{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.note{margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.none{padding:60px 0;text-align:center;color:var(--muted)}

.save{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:14px;background:var(--ink);color:var(--bg)}
.save .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.save .msg{font-weight:600}
.save .msg small{display:block;font-weight:400;opacity:.75}
.save .acts{display:flex;gap:8px}
.save .btn.ghost{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.save .btn{background:var(--tag);color:var(--tag-ink)}

.lb{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:8px}
.lb p{margin:0;color:#fff;font-weight:600;text-align:center}
.lb > button#lbClose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}

.count{position:absolute;right:8px;top:28px;font-family:var(--f-mono);font-size:11px;background:var(--surface);color:var(--ink);border-radius:6px;padding:2px 7px;z-index:1;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.lbstage{position:relative;display:flex;align-items:center;justify-content:center;max-width:100%;min-width:0}
.lb .nav{all:unset;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);color:#141B24;font-size:28px;line-height:42px;text-align:center}
.lb .nav:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lb .prev{left:8px} .lb .next{right:8px}
.lbtools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lbtools .tag{color:#fff;font-size:13px;font-weight:600;padding:6px 4px}
.want{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.wantbtn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.wantbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card.wanted{box-shadow:0 0 0 2px var(--accent)}
.field{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface);color:var(--muted);font-size:13px;min-width:0}
.field input,.field select{font:inherit;font-size:14px;border:0;background:transparent;color:var(--ink);width:4.6em;padding:6px 0;font-variant-numeric:tabular-nums;min-width:0}
.field select{width:auto}
.field:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.field input:focus,.field select:focus{outline:none}
.offered{all:unset;cursor:pointer;align-self:flex-start;font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:3px 7px}

  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}

.muted{margin:0;color:var(--muted);font-size:14px}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row.compact{grid-template-columns:minmax(0,1fr) auto;padding:7px 0;font-size:14px}
.rname{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.totalrow{display:flex;justify-content:space-between;margin:0;font-size:16px}

.pacts{display:flex;flex-wrap:wrap;gap:8px}
.offer{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ohead > div{display:flex;flex-direction:column;gap:2px}
.ototal{font-family:var(--f-display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.onote{margin:0;font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.btn.danger{background:var(--danger);color:var(--surface)}
.tray .btn{background:var(--accent);color:var(--accent-ink)}
.body{flex:1}
.val{margin-top:auto;align-self:flex-end;display:flex;align-items:center;gap:8px;padding-top:6px;font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums}
.val .each{color:var(--muted)}
.val span:not(.each),.valsum span{display:inline-flex;align-items:center;gap:3px}
.val .lo::before,.val .md::before,.val .hi::before,.valsum .lo::before,.valsum .md::before,.valsum .hi::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.lo{color:var(--v-lo)} .md{color:var(--v-md)} .hi{color:var(--v-hi)}
.valsum{display:block;margin-top:4px;font-family:var(--f-mono);font-size:12px}
.valsum span{margin-left:6px}
.mkt{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);text-align:right}
.delitem{all:unset;cursor:pointer;align-self:flex-start;min-height:32px;display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--danger);text-decoration:underline;text-underline-offset:2px}
.delitem:focus-visible{outline:2px solid var(--danger);outline-offset:2px}
.delask{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;padding:8px;border:1px solid var(--danger);border-radius:8px;font-size:13px}
.delask span{flex-basis:100%;font-weight:600}
footer{color:var(--muted);font-size:13px;padding-block:24px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.card:hover{transform:translateY(-2px)}}
</style>
</head>

function card(it){

  var h='<article class="card'+(shop&&mine?' wanted':'')+'" data-id="'+esc(it.id)+'"><div class="shot"><span class="peg"></span>';
  if(cover)h+='<img src="'+esc(cover.url)+'" alt="'+esc(it.name)+'" loading="lazy" onerror="this.hidden=true"><button class="zoom" type="button" data-zoom="'+esc(it.id)+'"><span class="vh">View photos of '+esc(it.name)+'</span></button>';
  else h+='<div class="empty"><span>'+(ed?'Drop photos here<br>or use Add photos':'Photo coming soon')+'</span></div>';
  if(ph.length>1)h+='<span class="count">'+ph.length+' photos</span>';
  if(it.qty>1)h+='<span class="qty">×'+it.qty+'</span>';
  if(ed){
    if(b)h+='<span class="state">Uploading '+b+'…</span>';
    else if(errs[it.id])h+='<span class="state err">'+esc(errs[it.id])+'</span>';
    else if(changed(it.id))h+='<span class="state ok">Changed, not saved yet</span>';
    h+='<div class="tools"><label class="btn small" for="picker" tabindex="0" role="button" data-pick="'+esc(it.id)+'">Add photos</label>';
    if(cover)h+='<button class="btn small ghost" type="button" data-zoom="'+esc(it.id)+'">Manage</button>';
    h+='</div>';
  }
  h+='</div><div class="body"><p class="sub">'+esc([it.brand,it.series].filter(Boolean).join(' · '))+'</p><h3>'+esc(it.name)+'</h3>';
  if(it.condition)h+='<span class="cond">'+esc(it.condition)+'</span>';
  if(it.note)h+='<p class="note">'+esc(it.note)+'</p>';
  if(edit&&!preview){var w=wantedBy(it.id);if(w.n)h+='<button class="offered" type="button" data-offers="1">Wanted by '+w.n+(w.credit?' · '+money(w.credit)+' offered':'')+'</button>'}
  if(edit&&!preview&&VALUES&&VALUES[it.id]){var v=VALUES[it.id];
    h+='<div class="val" role="img" aria-label="Market value'+(it.qty>1?' each':'')+': low '+money(v.low)+', middle '+money(v.mid)+', high '+money(v.high)+'">'+(it.qty>1?'<span class="each">each</span>':'')+
      '<span class="lo">'+money(v.low)+'</span><span class="md">'+money(v.mid)+'</span><span class="hi">'+money(v.high)+'</span></div>'}
  if(editing())h+=askItem===it.id?'<div class="delask" role="group" aria-label="Delete '+esc(it.name)+'"><span>Remove this listing from the page?</span><button class="btn small danger" type="button" data-delitem="'+esc(it.id)+'"'+(saving?' disabled':'')+'>Delete</button><button class="btn small ghost" type="button" data-keepitem>Keep</button></div>'
    :'<button class="delitem" type="button" data-askitem="'+esc(it.id)+'">Delete item</button>';
  if(shop){
    h+='<div class="want"><button class="wantbtn" type="button" data-want="'+esc(it.id)+'" aria-pressed="'+!!mine+'">'+(mine?CHECK+'In your offer':PLUS+'Add to offer')+'</button>';
    if(mine){
      if(it.qty>1){h+='<label class="field"><span class="vh">How many</span><select data-qty="'+esc(it.id)+'" id="qty-'+esc(it.id)+'">';for(var i=1;i<=it.qty;i++)h+='<option value="'+i+'"'+(i===mine.qty?' selected':'')+'>'+i+' of '+it.qty+'</option>';h+='</select></label>'}
      h+='<label class="field"><span aria-hidden="true">$</span><span class="vh">Store credit for '+esc(it.name)+'</span><input type="number" inputmode="decimal" min="0" step="1" placeholder="Credit" data-credit="'+esc(it.id)+'" id="cr-'+esc(it.id)+'" value="'+(typeof mine.credit==='number'?mine.credit:'')+'"></label>';
    }
    h+='</div>';
  }
  return h+'</div></article>';
}
function renderGrid(){
  var needle=q.trim().toLowerCase();
  var items=ITEMS.filter(function(it){return (filter==='All'||it.line===filter)&&(!needle||(it.name+' '+it.brand+' '+it.series+' '+(it.note||'')).toLowerCase().indexOf(needle)>-1)});
  var groups=[],idx={};
  items.forEach(function(it){var k=it.line;if(!(k in idx)){idx[k]=groups.length;groups.push({line:k,items:[]})}groups[idx[k]].items.push(it)});
  document.getElementById('grid').innerHTML=groups.length?groups.map(function(g){
    return '<section class="group"><h2>'+esc(g.line)+'<span class="brand">'+g.items.length+' listing'+(g.items.length===1?'':'s')+'</span></h2><div class="grid">'+g.items.map(card).join('')+'</div></section>'}).join('')
    :'<p class="none">Nothing matches “'+esc(q)+'”. Try a character or brand name.</p>';
  var n=0;ITEMS.forEach(function(it){if(shown(it.id).length)n++});document.getElementById('photoCount').textContent=n;
}

/* ---------- photos ---------- */
function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||!window.createImageBitmap)return Promise.resolve(file);
  return createImageBitmap(file,{imageOrientation:'from-image'}).then(function(bmp){
    var m=1600,s=Math.min(1,m/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return new Promise(function(res){c.toBlob(function(b){res(b&&b.size<file.size?b:file)},'image/jpeg',.85)});
  }).catch(function(){return file});
}
function errMsg(e){var c=e&&e.code;
  if(c==='unsupported_type')return 'That file type isn’t supported. Use a JPEG or PNG.';
  if(c==='too_large')return 'A photo is over 20 MB. Try a smaller one.';
  if(c==='quota_or_state')return 'Photo storage is full. Remove some photos first.';
  if(c==='rate_limited')return 'Too many uploads at once. Wait a moment and try again.';
  return 'An upload failed. Try again.'}
function upload(id,files){
  if(!assets)return;ensure(id);delete errs[id];
  Array.prototype.forEach.call(files,function(file){
    if(!/^image\//.test(file.type)){errs[id]='That isn’t an image file.';return}
    var entry={status:'uploading',url:URL.createObjectURL(file)};draft[id].push(entry);
    shrink(file).then(function(b){return assets.upload(b,{type:b.type||file.type})}).then(function(r){
      entry.status='ready';entry.assetId=r.id;entry.url=r.url;stash();renderAll();
    },function(e){var a=draft[id],i=a.indexOf(entry);if(i>-1)a.splice(i,1);errs[id]=errMsg(e);renderAll()});
  });
  renderAll();
}
function buildDoc(photos){
  var data={items:ITEMS,photos:photos,updated:new Date().toISOString().slice(0,10)};
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+HEAD+
   '<style id="css">'+document.getElementById('css').textContent+'</style>\n'+
   '<script type="application/json" id="catalog-data">'+JSON.stringify(data).replace(/</g,'\\u003c')+'</scr'+'ipt>\n<div id="app"></div>\n'+
   '<script id="app-src">'+document.getElementById('app-src').textContent+'</scr'+'ipt></body></html>';
}
function save(){
  if(saving||busyCount()||!changedCount())return;
  var photos={};ITEMS.forEach(function(it){var a=ids(it.id);if(a.length)photos[it.id]=a});
  saving=true;stash();renderSave();
  art.publish(buildDoc(photos)).then(function(){try{sessionStorage.removeItem(STASH)}catch(e){}},function(e){
    saving=false;var c=e&&e.code,m;
    if(c==='conflict')m='A newer version was just saved. Reloading. Your new photos will still be here.';
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled'){edit=false;renderAll();return}
    else if(c==='rate_limited')m='Saving too often. Wait a minute, then save again.';
    else m='Couldn’t save. Try again in a moment.';
    renderSave();var el=document.getElementById('saveMsg');if(el)el.innerHTML=esc(m);
  });
}

function deleteItem(id,btn){
  if(saving||!art)return;
  if(busyCount()){btn.textContent='Wait for uploads';return}
  var keep=ITEMS.filter(function(it){return it.id!==id}),photos={};
  keep.forEach(function(it){var a=ids(it.id);if(a.length)photos[it.id]=a});
  var all=ITEMS;ITEMS=keep;var doc=buildDoc(photos);ITEMS=all;
  saving=true;btn.disabled=true;btn.textContent='Deleting…';
  art.publish(doc).then(function(){try{sessionStorage.removeItem(STASH)}catch(e){}},function(e){
    saving=false;var c=e&&e.code;btn.disabled=false;
    btn.textContent=c==='conflict'?'Page changed. Reloading':c==='rate_limited'?'Too fast. Try in a minute':'Couldn’t delete. Try again'});
}

function toggleWant(id){var it=byId(id);if(!it)return;if(offer.items[id])delete offer.items[id];else offer.items[id]={qty:1,credit:null};
  if(!preview)scheduleSave();renderGrid();renderTray();renderSheet();
  if(offer.items[id]&&!sheet){var c=document.getElementById('cr-'+id);if(c)c.focus()}}
function setCredit(id,val){var e=offer.items[id];if(!e)return;var v=parseFloat(val);e.credit=isFinite(v)&&v>=0?v:null;
  ['cr-','scr-'].forEach(function(p){var x=document.getElementById(p+id);if(x&&x!==document.activeElement)x.value=e.credit==null?'':e.credit});
  if(!preview)scheduleSave();else renderTray();var st=document.getElementById('sheetTotal');if(st)st.textContent=money(total())}
function copyText(txt,btn){var done=function(){var o=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=o},1600)};
  var fallback=function(){var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);if(ok)done();else{var pre=document.createElement('textarea');pre.className='copybox';pre.value=txt;pre.readOnly=true;btn.parentNode.after(pre);pre.select()}};
  try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}}

  if(e.target===sheetEl||e.target.closest('[data-close]')){sheet=null;confirmDel=null;renderSheet();return}
  var w=e.target.closest('[data-want]');if(w){toggleWant(w.getAttribute('data-want'));return}
  var cp=e.target.closest('[data-copy]');if(cp){var k=cp.getAttribute('data-copy');if(k==='mine')copyText(offerText(offer),cp);else{var o=offers.filter(function(x){return x.id===k})[0];if(o)copyText(offerText(o.data,names[k]||''),cp)}return}
  if(e.target.closest('[data-clear]')){offer.items={};if(!preview)scheduleSave();renderAll();return}
  var ad=e.target.closest('[data-askdel]');if(ad){confirmDel=ad.getAttribute('data-askdel');renderSheet();return}
  if(e.target.closest('[data-nodel]')){confirmDel=null;renderSheet();return}
  var dl=e.target.closest('[data-delete]');if(dl&&db){var id=dl.getAttribute('data-delete');dl.disabled=true;db.doc('offers/'+id).delete().then(function(){confirmDel=null},function(){dl.disabled=false;dl.textContent='Couldn’t delete. Try again'})}
});
sheetEl.addEventListener('input',function(e){var t=e.target;
  if(t.matches('input[data-credit]'))setCredit(t.getAttribute('data-credit'),t.value);
  if(t.id==='offerNote'){offer.note=t.value.slice(0,2000);if(!preview)scheduleSave()}});
function step(d){if(!lb)return;var n=shown(lb.id).length;if(n<2)return;lb.i=(lb.i+d+n)%n;renderLb()}
function closeLb(){lb=null;renderLb()}
document.getElementById('lbClose').addEventListener('click',closeLb);
document.getElementById('lbPrev').addEventListener('click',function(){step(-1)});
document.getElementById('lbNext').addEventListener('click',function(){step(1)});
document.getElementById('lb').addEventListener('click',function(e){if(e.target.id==='lb')closeLb()});
document.getElementById('lbTools').addEventListener('click',function(e){
  if(!lb)return;var id=lb.id;ensure(id);var ph=shown(id),cur=ph[lb.i],a=draft[id],i=a.indexOf(cur);if(i<0)return;
  if(e.target.closest('[data-cover]')){a.splice(i,1);a.unshift(cur);lb.i=0}
  else if(e.target.closest('[data-del]')){a.splice(i,1)}
  else return;
  stash();renderAll();
});
var sx=null;
document.getElementById('lb').addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
document.getElementById('lb').addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)step(dx<0?1:-1)});
document.addEventListener('keydown',function(e){if(e.key!=='Escape'&&!lb)return;
  if(e.key==='Escape'){if(lb)closeLb();else if(sheet){sheet=null;confirmDel=null;renderSheet()}return}
  if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});

/* ---------- start ---------- */
try{var lo=JSON.parse(localStorage.getItem(LOCAL)||'null');if(lo)offer=clean(lo)}catch(e){}
renderAll();
var offersLoaded=false, offersSlow=false;
if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('assets'),window.claude.use('artifact'),window.claude.use('db'),window.claude.use('user')]).then(function(r){
    assets=r[0];art=r[1];db=r[2];user=r[3];
    if(assets&&art){edit=true;unstash();offer={items:{},note:''};
      if(db){db.doc('private/values').get().then(function(s){var d=s.exists&&s.data();if(d&&d.values){VALUES=d.values;renderGrid();renderOwner();renderSheet()}},function(){});var t=setTimeout(function(){offersSlow=true;renderSheet()},10000);
        db.collection('offers').onSnapshot(function(snap){if(!snap.metadata.fromCache){clearTimeout(t);offersLoaded=true}
          offers=snap.docs.filter(function(d){return d.exists}).map(function(d){var c=clean(d.data());c.updatedAt=d.data().updatedAt;return{id:d.id,data:c}}).filter(function(o){return picks(o.data).length||o.data.note})
            .sort(function(a,b){return (b.data.updatedAt||0)-(a.data.updatedAt||0)});
          var key=JSON.stringify(offers);if(key===offersKey&&!sheet)return;offersKey=key;
          resolveNames();renderGrid();renderOwner();renderSheet();
        },function(){clearTimeout(t);offersLoaded=true;offersSlow=true;renderSheet()});
      } else {offersLoaded=true}
      renderAll();return}
    if(db&&user){user.id().then(function(id){if(!id){renderTray();return}uid=id;offerMode='db';
      db.doc('offers/'+uid).get().then(function(s){offerLoaded=true;if(s.exists&&!touched){offer=clean(s.data());persistLocal()}else if(touched){flush()}else if(picks().length){scheduleSave()}renderAll()},
        function(){offerMode='local';renderTray()})})}
  },function(){});
}
})();
</script>
</body>
</html>
